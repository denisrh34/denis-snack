<!-- Modal Component -->
<!-- Usage: substitute {{id}}, {{title}}, {{content}}, {{size}}, {{closeLabel}}, {{showClose}} -->
<div class="modal-overlay" id="${id}-overlay" role="dialog" aria-modal="true" aria-labelledby="${id}-title" hidden>
  <div class="modal-container modal-${size}">
    <div class="modal-content">
      ${showClose ? `
      <button class="modal-close" aria-label="${closeLabel}" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      ` : ''}
      ${title ? `
      <header class="modal-header">
        <h2 id="${id}-title" class="modal-title">${title}</h2>
      </header>
      ` : ''}
      <div class="modal-body">
        ${content}
      </div>
      ${footer ? `
      <footer class="modal-footer">
        ${footer}
      </footer>
      ` : ''}
    </div>
  </div>
</div>
