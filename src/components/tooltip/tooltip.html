<!-- Tooltip Component -->
<!-- Usage: substitute {{id}}, {{content}}, {{placement}}, {{trigger}}, {{delay}} -->
<div class="tooltip" id="${id}" role="tooltip" data-placement="${placement}" data-trigger="${trigger}" data-delay="${delay}" hidden>
  <div class="tooltip-arrow" aria-hidden="true"></div>
  <div class="tooltip-content">${content}</div>
</div>
